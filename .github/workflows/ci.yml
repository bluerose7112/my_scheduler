name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tag pushes are handled by release.yml
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  # Catches PyInstaller/pywebview packaging breakage before a tag is cut.
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-exe
          path: dist/scheduler.exe
          retention-days: 7
