name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tag pushes are handled by release.yml
  pull_request:

jobs:
  test:
    # Windows too: Release runs pytest there, so platform-specific failures must show up before a tag is cut.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  # Catches PyInstaller/pywebview packaging breakage before a tag is cut.
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python build.py
      # Build success only proves packaging; this proves the exe's bundled files, db and GUI backend imports work.
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\scheduler.exe -ArgumentList '--self-test','selftest.json' -Wait -PassThru
          if (Test-Path selftest.json) { Get-Content selftest.json } else { Write-Host 'no selftest.json written' }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }
      # The real check: start the exe, wait for its window AND for the app UI to initialize
      # (scheduler-start.log gets "event: ui ready" once app.js rendered). The log is always printed so a failure shows how far startup got.
      - name: Launch the exe and confirm a window opens
        shell: pwsh
        run: |
          Start-Process (Resolve-Path dist\scheduler.exe).Path | Out-Null
          $deadline = (Get-Date).AddSeconds(150); $win = $null; $loaded = $false
          while ((Get-Date) -lt $deadline -and -not ($win -and $loaded)) {
            Start-Sleep 2
            $win = Get-Process scheduler -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like 'My Scheduler*' } | Select-Object -First 1
            $loaded = (Test-Path dist\scheduler-start.log) -and ((Get-Content dist\scheduler-start.log -Raw) -match 'event: ui ready')
            if (Test-Path dist\scheduler-error.log) { break }
          }
          foreach ($f in 'scheduler-start.log', 'scheduler-error.log') {
            if (Test-Path "dist\$f") { Write-Host "--- $f ---"; Get-Content "dist\$f" }
          }
          Get-Process scheduler -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, MainWindowTitle -AutoSize | Out-String | Write-Host
          Get-Process scheduler -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $win) { throw 'no window titled "My Scheduler" appeared' }
          if (-not $loaded) { throw 'window opened but the UI never initialized (no "event: ui ready" in scheduler-start.log)' }
          Write-Host "window opened and page loaded: $($win.MainWindowTitle)"
      # Debug build with a console: run it from cmd to see the traceback if the normal exe shows nothing.
      - run: python build.py --console
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-console-exe
          path: dist/scheduler-console.exe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-exe
          path: dist/scheduler.exe
          retention-days: 7
