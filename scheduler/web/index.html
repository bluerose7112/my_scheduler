<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>My Scheduler</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="brand">Scheduler</span>
  <nav class="seg" id="tabs">
    <button data-tab="gantt" class="active">간트</button>
    <button data-tab="list">리스트</button>
    <button data-tab="text">텍스트</button>
  </nav>
  <div class="spacer"></div>
  <button id="btn-new-project" class="primary">＋ 과제</button>
  <button id="btn-settings" class="icon" title="LLM 서버 설정">설정</button>
</header>

<main>
  <section id="view-wrap"><div id="view"></div><div id="detail" hidden></div></section>
  <div id="splitter"></div>
  <aside id="chat">
    <div class="chat-head"><b>어시스턴트</b><small id="version" class="version"></small><span class="spacer"></span>
      <button id="llm-undo" class="ghost" title="마지막 AI 변경 되돌리기">되돌리기</button>
      <button id="chat-clear" class="ghost" title="대화 지우기">지우기</button></div>
    <div id="msgs"></div>
    <div class="chat-in"><div class="box">
      <textarea id="llm-input" rows="2" placeholder="일정을 입력하거나 질문하세요"></textarea>
      <button id="llm-send" class="send" title="전송" aria-label="전송">↑</button>
    </div></div>
  </aside>
</main>
<div id="status"></div>

<dialog id="settings-dlg">
  <form method="dialog">
    <h3>로컬 LLM 설정</h3>
    <label>프로토콜
      <select id="s-proto"><option value="openai">OpenAI 호환 (/chat/completions)</option></select>
    </label>
    <label>서버 주소 <input id="s-url" placeholder="http://localhost:1234/v1"></label>
    <label>모델 (선택) <input id="s-model"></label>
    <label>API 키 (선택) <input id="s-key" type="password"></label>
    <label>타임아웃(초) <input id="s-timeout" type="number" min="5"></label>
    <div class="row">
      <button type="button" id="s-test">연결 테스트</button>
      <button type="button" id="s-diag">진단</button>
      <span id="s-result"></span>
      <span class="spacer"></span>
      <button type="button" id="s-save">저장</button>
      <button value="cancel">닫기</button>
    </div>
    <pre id="s-diag-out" hidden></pre>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
